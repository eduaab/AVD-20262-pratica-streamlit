# Configuração de Identidade Visual do Streamlit (AVD 2026.2)
# Paleta alinhada à EDA: Roxo vibrante de alto contraste (#8338ec) e Areia/Rosa claro (#e9d4d0)

[theme]
paddingTop = "1.0rem"
font = "sans serif"

[theme.light]
primaryColor = "#8338ec"            # Cor de destaque (botões, sliders, tabs)
backgroundColor = "#ffffff"         # Fundo principal
secondaryBackgroundColor = "#f8f9fa"  # Fundo da sidebar e cartões
textColor = "#212529"               # Cor do texto principal
borderColor = "#dee2e6"

[theme.dark]
primaryColor = "#a855f7"            # Cor de destaque no tema escuro
backgroundColor = "#0f0c15"         # Fundo escuro neutro
secondaryBackgroundColor = "#1c1826"  # Fundo de widgets no escuro
textColor = "#f8f9fa"
borderColor = "#383149"
